name: Static Analysis (Ruff)

on: push

jobs:
  call-secrets-analysis-workflow:
    uses: ASFHyP3/actions/.github/workflows/reusable-secrets-analysis.yml@v0.21.1

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          environments: lint

      - name: ruff check
        run: pixi run -e lint ruff check --output-format=github

      - name: ruff format
        if: ${{ !cancelled() }}
        run: pixi run -e lint ruff format --diff
