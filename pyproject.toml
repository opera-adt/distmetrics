[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = 'distmetrics'
requires-python = '>=3.12'
authors = [
    {name ='Charlie Marshak, Talib Oliver-Cabrera, Richard West, Jungkyo Jung and OPERA Project Science Team', email ='opera-pst-dev@jpl.nasa.gov'}
]
description = 'Measure Disturbances in OPERA RTC-S1 Stacks'
license = {text = 'Apache-2.0'}
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

dynamic = ['version', 'readme']

dependencies = [
        'affine',
        'asf_search',
        'astropy',
        'dem_stitcher>=3.2',
        'einops',
        'geopandas',
        'matplotlib',
        'numpy',
        'pandas',
        'pydantic',
        'torch',
        'rasterio',
        'scikit-image',
        'scipy',
        'shapely',
        'tenacity',
        'tqdm',
]

[project.optional-dependencies]
develop = [
    'pytest',
    'pytest-cov',
    'ruff',
    'jupyterlab',
]

[project.urls]
Homepage = "https://github.com/opera-adt/distmetrics"
"Bug Tracker" = "https://github.com/opera-adt/distmetrics/issues"

[tool.setuptools]
include-package-data = true
zip-safe = true

[tool.setuptools.packages.find]
where = ['src']
exclude = ['notebooks*', 'tests*']

[tool.setuptools.dynamic]
readme = { file = ['README.md'], content-type = 'text/markdown' }

[tool.setuptools_scm]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "notebooks/*",
    "tests/data/*",
]
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = [
    "F",   # flake8: https://docs.astral.sh/ruff/rules/#flake8-f
    "E",   # flake8: https://docs.astral.sh/ruff/rules/#flake8-e
    "I",   # isort: https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade: https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "D",   # pydocstyle: https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "PTH", # use-pathlib-pth: https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TRY", # tryceratops
]

ignore = [
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D106",   # Missing docstring in nested class
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "TRY003", # Avoid specifying long messages outside the exception
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 2
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
distmetrics = { path = ".", editable = true }
# 3.2.0 fixes nodata handling in reprojection (see test_rio_tools.py) but is not on
# conda-forge yet; move back to [tool.pixi.dependencies] once the feedstock updates.
dem_stitcher = ">=3.2.0,<4"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.16.3,<0.17"

[tool.pixi.feature.lint.tasks]
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --diff"

# `default` is the newest supported python and the only environment materialized locally.
# The pyXYZ environments back the CI matrix; each runner installs exactly one of them.
# `lint` is python-free so the ruff job does not pay for the geospatial stack.
[tool.pixi.environments]
default = { features = ["py314", "lint"], solve-group = "py314" }
py312 = { features = ["py312"], solve-group = "py312" }
py313 = { features = ["py313"], solve-group = "py313" }
py314 = { features = ["py314"], solve-group = "py314" }
lint = { features = ["lint"], no-default-feature = true }

[tool.pixi.tasks]
test = "pytest tests"

[tool.pixi.dependencies]
asf_search = ">=12.3.1,<13"
astropy = ">=8.0.1,<9"
einops = ">=0.8.2,<0.9"
gdal = ">=3.13.2,<4"
geopandas = ">=1.1.4,<2"
jupyterlab = ">=4.6.3,<5"
jupyter-collaboration = ">=5.0.0,<6"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.2,<3"
pandas = ">=3.0.5,<4"
pydantic = ">=2.13.4,<3"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytorch = ">=2.10.0,<3"
rasterio = ">=1.4.0,<2"  # merge was improved in this minor release
requests = ">=2.34.2,<3"
scikit-image = ">=0.26.0,<0.27"
scipy = ">=1.18.0,<2"
setuptools = ">=84.0.0,<85"
setuptools_scm = ">=10.2.1,<11"
shapely = ">=2.1.2,<3"
# asf_search on conda-forge currently pins tenacity ==8.2.2
tenacity = ">=8.2.2,<10"
tqdm = ">=4.70.0,<5"
